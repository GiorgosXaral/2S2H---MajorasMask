# Builds 2 Ship 2 Harkinian (lightmanLP's mouse-support fork, tag M3.1.0) for Windows with both overhaul patches.
#
# Put this file at .github/workflows/build.yml in your repository, with these two files at the repository root:
#   mm-boss-overhaul.patch       (Boss Overhaul, Epona Control Overhaul, Sword Projectiles)
#   mm-miniboss-overhaul.patch   (Miniboss & Enemy Overhaul, needs the boss patch first)
#
# Runs on every push and from the Actions tab ("Run workflow"). The finished build is the "2ship-windows" artifact.
name: build-2ship-overhaul
 
on:
  push:
  workflow_dispatch:
 
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
 
env:
  UPSTREAM_REPO: lightmanLP/2ship2harkinian
  UPSTREAM_REF: M3.1.0
 
jobs:
  generate-2ship-otr:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout 2Ship (${{ env.UPSTREAM_REPO }} @ ${{ env.UPSTREAM_REF }})
        uses: actions/checkout@v6
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ env.UPSTREAM_REF }}
          submodules: true
 
      - name: Checkout patches
        uses: actions/checkout@v6
        with:
          path: overlay
 
      - name: Apply patches
        run: |
          git apply --check --whitespace=nowarn overlay/mm-boss-overhaul.patch
          git apply --whitespace=nowarn overlay/mm-boss-overhaul.patch
          git apply --check --whitespace=nowarn overlay/mm-miniboss-overhaul.patch
          git apply --whitespace=nowarn overlay/mm-miniboss-overhaul.patch
          rm -rf overlay
          git status --short | head -n 200
 
      - name: Configure ccache
        uses: hendrikmuhs/ccache-action@v1.2.22
        with:
          key: ${{ runner.os }}-otr-ccache-${{ github.ref }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-otr-ccache-${{ github.ref }}
            ${{ runner.os }}-otr-ccache
 
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y $(cat .github/workflows/apt-deps.txt) libzip-dev zipcmp zipmerge ziptool
 
      - name: Install SDL 2.30.3
        run: |
          export PATH="/usr/lib/ccache:/usr/local/opt/ccache/libexec:$PATH"
          mkdir -p deps
          wget -q https://github.com/libsdl-org/SDL/releases/download/release-2.30.3/SDL2-2.30.3.tar.gz
          tar -xzf SDL2-2.30.3.tar.gz -C deps
          cd deps/SDL2-2.30.3
          ./configure --enable-hidapi-libusb
          make -j 10
          sudo make install
          sudo cp -av /usr/local/lib/libSDL* /lib/x86_64-linux-gnu/
 
      - name: Install tinyxml2 10.0.0
        run: |
          sudo apt-get remove -y libtinyxml2-dev
          export PATH="/usr/lib/ccache:/usr/local/opt/ccache/libexec:$PATH"
          wget -q https://github.com/leethomason/tinyxml2/archive/refs/tags/10.0.0.tar.gz
          tar -xzf 10.0.0.tar.gz -C deps
          cd deps/tinyxml2-10.0.0
          mkdir -p build
          cd build
          cmake ..
          make
          sudo make install
 
      - name: Generate 2ship.o2r
        run: |
          export PATH="/usr/lib/ccache:/usr/local/opt/ccache/libexec:$PATH"
          cmake --no-warn-unused-cli -H. -Bbuild-cmake -GNinja -DCMAKE_BUILD_TYPE:STRING=Release
          cmake --build build-cmake --config Release --target Generate2ShipOtr -j3
 
      - name: Upload 2ship.o2r
        uses: actions/upload-artifact@v7
        with:
          name: 2ship.o2r
          path: 2ship.o2r
          retention-days: 3
 
  build-windows:
    needs: generate-2ship-otr
    runs-on: windows-latest
    steps:
      - name: Install dependencies
        run: |
          choco install ninja -y
          Remove-Item -Path "C:\ProgramData\Chocolatey\bin\ccache.exe" -Force -ErrorAction SilentlyContinue
 
      # Keep the sources exactly as they are in git (LF), so both patches apply cleanly on Windows
      - name: Configure git line endings
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
 
      - name: Checkout 2Ship (${{ env.UPSTREAM_REPO }} @ ${{ env.UPSTREAM_REF }})
        uses: actions/checkout@v6
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ env.UPSTREAM_REF }}
          submodules: true
 
      - name: Checkout patches
        uses: actions/checkout@v6
        with:
          path: overlay
 
      - name: Apply patches
        run: |
          git apply --check --whitespace=nowarn overlay/mm-boss-overhaul.patch
          if ($LASTEXITCODE -ne 0) { throw "mm-boss-overhaul.patch does not apply" }
          git apply --whitespace=nowarn overlay/mm-boss-overhaul.patch
          if ($LASTEXITCODE -ne 0) { throw "mm-boss-overhaul.patch failed" }
          git apply --check --whitespace=nowarn overlay/mm-miniboss-overhaul.patch
          if ($LASTEXITCODE -ne 0) { throw "mm-miniboss-overhaul.patch does not apply" }
          git apply --whitespace=nowarn overlay/mm-miniboss-overhaul.patch
          if ($LASTEXITCODE -ne 0) { throw "mm-miniboss-overhaul.patch failed" }
          Remove-Item -Recurse -Force overlay
          git status --short
 
      - name: Configure sccache
        uses: hendrikmuhs/ccache-action@v1.2.22
        with:
          variant: sccache
          max-size: "2G"
          evict-old-files: job
          key: ${{ runner.os }}-ccache-${{ github.ref }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-ccache-${{ github.ref }}
            ${{ runner.os }}-ccache
 
      - name: Restore cached vcpkg folder
        id: restore-cache-vcpkg
        uses: actions/cache/restore@v4
        with:
          key: ${{ runner.os }}-vcpkg-${{ github.ref }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-vcpkg-${{ github.ref }}-
            ${{ runner.os }}-vcpkg-
          path: vcpkg
 
      - name: Configure Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1
 
      - name: Download 2ship.o2r
        uses: actions/download-artifact@v8
        with:
          name: 2ship.o2r
          path: build-windows/mm
 
      - name: Build 2Ship
        env:
          VCPKG_ROOT: ${{ github.workspace }}/vcpkg
        run: |
          set $env:PATH="$env:USERPROFILE/.cargo/bin;$env:PATH"
          cmake -S . -B build-windows -G Ninja -DCMAKE_MAKE_PROGRAM=ninja -DCMAKE_BUILD_TYPE:STRING=Release -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache
          if ($LASTEXITCODE -ne 0) { throw "CMake configure failed" }
          cmake --build build-windows --config Release --parallel 10
          if ($LASTEXITCODE -ne 0) { throw "Build failed" }
 
          (cd build-windows && cpack)
          cd ..
          mv _packages/*.zip _packages/2ship-windows.zip
 
      - name: Unzip package
        run: Expand-Archive -Path _packages/2ship-windows.zip -DestinationPath 2ship-windows
 
      - name: Upload build
        uses: actions/upload-artifact@v7
        with:
          name: 2ship-windows
          path: 2ship-windows
 
      - name: Save cached vcpkg folder
        if: ${{ success() && github.ref_name == github.event.repository.default_branch }}
        uses: actions/cache/save@v4
        with:
          key: ${{ steps.restore-cache-vcpkg.outputs.cache-primary-key }}
          path: vcpkg
 
