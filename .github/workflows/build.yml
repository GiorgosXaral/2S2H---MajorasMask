name: build-mm-boss-overhaul
on:
  push:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-windows:
    runs-on: windows-latest
    steps:
    - name: Keep LF line endings so the patch applies
      run: git config --global core.autocrlf false
    - name: Checkout this repo (contains mm-boss-overhaul.patch)
      uses: actions/checkout@v6
      with:
        path: builder
    - name: Checkout 2 Ship 2 Harkinian 5.0.1
      uses: actions/checkout@v6
      with:
        repository: HarbourMasters/2ship2harkinian
        ref: 8a24047fbce8915993804e7819f4df4fa591551f
        submodules: true
        path: 2ship
    - name: Apply Boss Overhaul patch
      working-directory: 2ship
      run: git apply --whitespace=nowarn ../builder/mm-boss-overhaul.patch
    - name: Install ninja
      run: |
        choco install ninja -y
        Remove-Item -Path "C:\ProgramData\Chocolatey\bin\ccache.exe" -Force -ErrorAction SilentlyContinue
    - name: Configure Developer Command Prompt
      uses: ilammy/msvc-dev-cmd@v1
    - name: Build 2ship.exe
      working-directory: 2ship
      env:
        VCPKG_ROOT: ${{ github.workspace }}/2ship/vcpkg
      run: |
        cmake -S . -B build-windows -G Ninja -DCMAKE_MAKE_PROGRAM=ninja -DCMAKE_BUILD_TYPE:STRING=Release
        cmake --build build-windows --config Release --parallel 4
    # Like Ship of Harkinian, this project's CMake puts the Windows exe in <source>/Release rather than the build
    # folder. Search for it instead of assuming a path, and never fail here: listing.txt goes into the artifact either
    # way, so a miss can be diagnosed from the download alone.
    - name: Collect 2ship.exe
      if: always()
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Continue'
        New-Item -ItemType Directory -Force -Path out | Out-Null
 
        $exe = $null
        if (Test-Path '2ship/Release/2ship.exe') {
          $exe = Get-Item '2ship/Release/2ship.exe'
        } else {
          $exe = Get-ChildItem -Path 2ship -Recurse -Filter 2ship.exe -File -Force -ErrorAction SilentlyContinue |
                 Sort-Object Length -Descending | Select-Object -First 1
        }
 
        $lines = @()
        if ($exe) {
          $lines += "FOUND 2ship.exe: $($exe.FullName)  ($($exe.Length) bytes)"
          Copy-Item $exe.FullName out/2ship.exe -Force
          $dir = Split-Path $exe.FullName -Parent
          $lines += "--- files next to it ---"
          Get-ChildItem -Path $dir -File -ErrorAction SilentlyContinue | ForEach-Object {
            $lines += "  $($_.Name)  $($_.Length)"
            if ($_.Extension -eq '.dll') { Copy-Item $_.FullName out/ -Force }
          }
        } else {
          $lines += "NO 2ship.exe ANYWHERE"
        }
 
        $lines += "--- every .exe built (vcpkg excluded) ---"
        Get-ChildItem -Path 2ship -Recurse -Filter *.exe -File -Force -ErrorAction SilentlyContinue |
          Where-Object { $_.FullName -notmatch '[\\/]vcpkg[\\/]' } |
          ForEach-Object { $lines += "  $($_.FullName)  $($_.Length)" }
 
        $lines | Out-File -FilePath out/listing.txt -Encoding utf8
        $lines | Write-Host
        exit 0
    - name: Upload 2ship.exe
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: 2ship-boss-overhaul
        path: out
        if-no-files-found: warn
 
